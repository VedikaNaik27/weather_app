<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="SkyPulse — Real-time live weather updates, 7-day forecast, global city search, and GPS location detection.">
  <meta name="keywords" content="Weather, Live Weather, Forecast, Flutter, Open-Meteo, Responsive Web App">
  <meta name="theme-color" content="#2193b0">

  <!-- Open Graph / Social Media Preview -->
  <meta property="og:title" content="SkyPulse — Live Weather & Forecast">
  <meta property="og:description" content="Real-time live weather, 7-day forecast, humidity, wind, and atmospheric pressure.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SkyPulse Weather">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SkyPulse — Live Weather & Forecast</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background-color: #1b2a47;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
